version: v2

modules:
  - path: proto
    lint:
      use:
        - STANDARD
      except:
        - RPC_REQUEST_RESPONSE_UNIQUE
        - RPC_RESPONSE_STANDARD_NAME
    breaking:
      use:
        - FILE
deps:
  - 'buf.build/liujitcn/kratos-core'
  - 'buf.build/googleapis/googleapis'
  - 'buf.build/kratos/apis'
  - 'buf.build/gnostic/gnostic'
  - 'buf.build/bufbuild/protovalidate'

breaking:
  use:
    - FILE
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE

lint:
  use:
    - DEFAULT
