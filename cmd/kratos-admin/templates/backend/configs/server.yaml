server:
  http:
    addr: :7001
    timeout: 0s
    enable_swagger: false
    enable_pprof: false
    cors:
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "http://localhost:8848"
        - "http://127.0.0.1:8848"
        - "http://localhost:5002"
        - "http://127.0.0.1:5002"
        - "http://localhost:5004"
        - "http://127.0.0.1:5004"
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_metadata: true

  grpc:
    addr: 0.0.0.0:6001
    timeout: 10s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_metadata: true

  mcp:
    transport: IN_PROCESS
    path: /mcp

  sse:
    transport: IN_PROCESS
    path: /events
    codec: json
    timeout: 10s
    event_ttl: 300s
    auto_stream: true
    auto_reply: true
